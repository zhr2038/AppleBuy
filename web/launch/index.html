<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="session-token" content="__SESSION_TOKEN__"><title>开售页面回放 — 离线演练</title><link rel="stylesheet" href="/style.css"></head><body>
<main class="wrap"><header><p class="eyebrow">Apple 直营店自提购买助手</p><h1>开售页面回放</h1><p class="notice">合成样本，仅在本机运行。本页不访问官网、不选择真实时段、不创建订单。</p><a href="/">返回购买演练</a></header>
<section class="panel"><h2>当前进度</h2><p id="control">正在连接…</p><h3 id="step">等待观察</h3><p id="next"></p><p id="binding"></p><p id="last"></p><p id="message" role="status"></p><button id="claim" type="button">获取控制权</button><button id="pause" type="button">暂停回放建议</button><button id="resume" type="button">恢复观察</button></section>
<section class="panel"><h2>回放一个页面变化</h2><label for="scenario">合成场景</label><select id="scenario">
<option value="prelaunch">尚未开售</option><option value="maintenance">疑似维护文案</option><option value="partial">尚未加载完整</option><option value="entry">入口恢复</option><option value="entry-reordered">入口改布局</option><option value="pickup-native">日期与原生时段控件</option><option value="pickup-reordered">重排并更换控件</option><option value="pickup-redrawn">更改时段间隔</option><option value="terminal-removed">末档被移除</option><option value="fourth-date">选择第四个日期</option><option value="year-missing">日期缺少年份</option><option value="unselected-pickup">自提控件未选中</option><option value="wrong-product">商品不符</option><option value="sign-in">要求登录</option><option value="consent">要求确认条款</option><option value="unknown">无法识别的改版</option><option value="rate-limit">限流</option><option value="restricted">访问限制</option><option value="service-unavailable">503，无维护证据</option><option value="network-failed">网络失败</option></select>
<button id="observe" type="button">加载样本并观察</button><p>通过当前实际 DOM 读取角色、选项和选中状态，重新计算离线候选。</p><div id="sample" class="card"></div><p id="candidates"></p></section>
<details class="panel"><summary>观察导入与异常验证</summary><p>仅导入规定格式的脱敏观察 JSON。来源声明未经独立核验，不会成为真实日期绑定或执行授权。不要填写账号、证件或付款资料。</p><label for="observation">脱敏观察 JSON</label><textarea id="observation" rows="6"></textarea><button id="import" type="button">仅导入观察</button><button id="pending" type="button">模拟提交结果不明</button><pre id="technical"></pre></details>
</main><script type="module" src="/launch/replay.js"></script></body></html>
