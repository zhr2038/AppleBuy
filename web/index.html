<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="session-token" content="__SESSION_TOKEN__">
<meta name="referrer" content="no-referrer">
<title>直营店自提助手｜本机演练（FAKE）</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="banner">【演练模式｜FAKE 虚构数据｜本机模拟官网，不访问苹果官网，不产生真实订单/付款/时段占用】</header>
<main>
  <section class="controls card">
    <h2>操作</h2>
    <p id="msg" class="msg">连接中…</p>
    <div class="row">
      <button id="claim">获取控制权</button>
      <label>模拟官网场景 <select id="scenario"></select></label>
      <button id="start">开始自动演练</button>
      <button id="recover">恢复运行（从日志，只读核实优先）</button>
    </div>
    <div class="row">
      <button id="pause">暂停</button>
      <button id="resume">恢复（先重新观察）</button>
      <button id="takeover">人工接管</button>
      <button id="stop">停止</button>
    </div>
  </section>
  <div id="view"></div>
  <section class="card">
    <h2>购买计划（FAKE，可编辑；保存后形成新版本，不影响正在运行的绑定版本）</h2>
    <textarea id="plan" rows="18" spellcheck="false"></textarea>
    <div class="row"><button id="savePlan">保存计划</button><button id="reloadPlan">放弃修改</button></div>
  </section>
  <section class="card">
    <h2>一次性模拟正式授权（仅对本机模拟官网有效；真实正式模式不可用）</h2>
    <p>请完整核对上方计划（当前版本哈希 <code id="planHash"></code>），然后输入确认语：<code id="phrase"></code></p>
    <div class="row"><label><input type="checkbox" id="reviewed"> 我已核对当前计划版本</label><input id="phraseInput" size="30" autocomplete="off"><button id="arm">启用一次</button></div>
  </section>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
